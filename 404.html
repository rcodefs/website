<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Rcodefs</title>
<meta name="description" content="That page does not exist. Head back to rcodefs.com.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#08090c">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#08090c;
    --surface:#10131a;
    --line:#1e2330;
    --line-strong:#2b3243;
    --text:#e9ebf2;
    --muted:#98a1b2;
    --accent:#7c5cff;
    --accent-text:#a78bfa;
    --font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:2rem;
    background:
      radial-gradient(60% 50% at 50% 0%,rgba(124,92,255,.18),transparent 70%),
      var(--bg);
    color:var(--text);
    font-family:var(--font);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:520px;text-align:center}
  .mark{
    display:grid;
    place-items:center;
    width:44px;height:44px;
    margin:0 auto 1.75rem;
    border-radius:12px;
    background:linear-gradient(150deg,var(--accent),#4b32c3);
    color:#fff;
    font-weight:700;
    box-shadow:0 0 0 1px rgba(167,139,250,.35),0 10px 30px -12px rgba(124,92,255,.9);
  }
  .code{
    font-family:var(--mono);
    font-size:.75rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--accent-text);
  }
  h1{
    margin:.9rem 0 0;
    font-size:clamp(1.9rem,6vw,2.6rem);
    line-height:1.15;
    letter-spacing:-.03em;
  }
  p{margin:1rem 0 0;color:var(--muted)}
  .actions{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:.75rem;
    margin-top:2rem;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:.7rem 1.15rem;
    border-radius:11px;
    border:1px solid transparent;
    background:var(--accent);
    color:#fff;
    font-size:.92rem;
    font-weight:600;
    transition:background .2s ease,transform .2s ease,border-color .2s ease;
  }
  .btn:hover{background:#8b6dff;transform:translateY(-1px)}
  .btn-ghost{background:transparent;border-color:var(--line-strong);color:var(--text)}
  .btn-ghost:hover{background:rgba(255,255,255,.05);border-color:#3a4358}
  :focus-visible{outline:2px solid var(--accent-text);outline-offset:3px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <main class="wrap">
    <div class="mark" aria-hidden="true">R</div>
    <p class="code">Error 404</p>
    <h1>This page doesn't exist</h1>
    <p>The link may be old, or the URL may have a typo. Everything useful lives on the main page.</p>

    <div class="actions">
      <a class="btn" href="/">Back to home</a>
      <a class="btn btn-ghost" href="mailto:hello@rcodefs.com?subject=Broken%20link%20on%20rcodefs.com">Report a broken link</a>
    </div>
  </main>
</body>
</html>
